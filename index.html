<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Memoir | 旅遊回憶錄</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Auth Page (Unauthenticated State) -->
  <div id="auth-page" class="aurora-bg">
    <div class="auth-content glass">
      <div class="auth-logo">◒ TRAVEL MEMOIR</div>
      <p class="auth-tagline">記錄每一段美好旅程 · 專屬旅遊回憶錄</p>
      
      <button id="login-btn" class="btn-primary" style="width: 100%; padding: 14px; font-size: 1.05rem;">
        <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        使用 Google 帳號登入
      </button>
      
      <p class="auth-help">旅伴邀請？直接點選邀請連結即可，登入後將自動加入。</p>
    </div>
  </div>

  <!-- Main App (Authenticated State) -->
  <div id="app">
    <!-- Topbar -->
    <header class="topbar glass">
      <div class="brand-logo">◒ Travel Memoir <span>旅遊回憶錄</span></div>
      <div class="user-menu">
        <button id="themeToggleBtn" class="chip" style="margin-right: 8px;">🌙 切換主題</button>
        <img id="user-avatar" class="user-avatar" src="" alt="User Avatar">
        <span id="user-name" class="user-name"></span>
        <button id="logout-btn" class="logout-btn">登出</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">
      <h2 class="section-header">我的旅程與回憶</h2>
      <div id="loading" class="loading-state"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
      <div id="trips" class="trip-grid"></div>
    </main>

    <!-- Admin Add Trip FAB -->
    <button id="add-trip-fab" class="fab" style="display: none;" title="新增旅程">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <!-- Add Trip Modal -->
  <div id="add-trip-modal" class="modal-overlay">
    <div class="dialog-card glass">
      <button class="dialog-close" id="close-modal-btn">&times;</button>
      <h2 class="dialog-header">新增旅程</h2>
      <form id="add-trip-form">
        <div class="form-group">
          <label>旅行名稱</label>
          <input type="text" id="trip-name" required placeholder="例如：2026 冰島極光之旅">
        </div>
        <div class="form-group">
          <label>目的地</label>
          <input type="text" id="trip-dest" required placeholder="例如：冰島">
        </div>
        <div class="form-group">
          <label>出發日期</label>
          <input type="date" id="trip-start" required>
        </div>
        <div class="form-group">
          <label>結束日期</label>
          <input type="date" id="trip-end" required>
        </div>
        <div class="form-group">
          <label>封面圖片 URL 或相對路徑</label>
          <input type="text" id="trip-cover" placeholder="images/seljalandsfoss.jpg 或 https://...">
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">建立旅程</button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALQhQzhnkj-UOmRZGVQKMKqkW0DecwE3s",
      authDomain: "my-travel-book-85243.firebaseapp.com",
      projectId: "my-travel-book-85243",
      storageBucket: "my-travel-book-85243.firebasestorage.app",
      messagingSenderId: "936708966292",
      appId: "1:936708966292:web:d3c7c08e14f60548cf3181"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const ADMIN_EMAIL = "dreamland11023@gmail.com";

    const authPage = document.getElementById('auth-page');
    const appPage = document.getElementById('app');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const addTripFab = document.getElementById('add-trip-fab');
    const addTripModal = document.getElementById('add-trip-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const addTripForm = document.getElementById('add-trip-form');
    const tripsContainer = document.getElementById('trips');
    const loadingState = document.getElementById('loading');
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    // Theme toggle
    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeToggleBtn.textContent = isLight ? '☀️ 淺色主題' : '🌙 深色主題';
    });

    // Auth
    loginBtn.addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => console.error(error));
    });

    logoutBtn.addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged(user => {
      if (user) {
        authPage.style.display = 'none';
        appPage.style.display = 'flex';
        
        document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/32';
        document.getElementById('user-name').textContent = user.displayName || user.email;

        if (user.email === ADMIN_EMAIL) {
          addTripFab.style.display = 'flex';
        }

        loadTrips(user);
      } else {
        authPage.style.display = 'flex';
        appPage.style.display = 'none';
      }
    });

    function loadTrips(user) {
      loadingState.style.display = 'flex';
      tripsContainer.innerHTML = '';

      db.collection('trips').onSnapshot(snapshot => {
        loadingState.style.display = 'none';
        tripsContainer.innerHTML = '';

        let hasTrips = false;

        snapshot.forEach(doc => {
          const trip = doc.data();
          const tripId = doc.id;

          // Permission check: admin or allowed
          const isAdmin = (user.email === ADMIN_EMAIL) ||
                          (trip.adminUids && trip.adminUids.includes(user.uid)) ||
                          (trip.admin === user.email);
          const isMember = (trip.memberUids && trip.memberUids.includes(user.uid)) ||
                           (trip.members && trip.members.includes(user.email));

          if (isAdmin || isMember) {
            hasTrips = true;
            renderTripCard(tripId, trip);
          }
        });

        // Always show Iceland 2026 card if not created or empty
        if (!hasTrips) {
          renderDefaultIcelandCard();
        }
      }, err => {
        console.error("Error loading trips:", err);
        loadingState.style.display = 'none';
        renderDefaultIcelandCard();
      });
    }

    function renderTripCard(tripId, trip) {
      const card = document.createElement('div');
      card.className = 'trip-card glass';
      card.onclick = () => window.location.href = `trip.html?id=${tripId}`;
      
      const title = trip.title || trip.name || '2026 冰島極光之旅';
      const cover = trip.coverImg || trip.coverUrl || 'images/seljalandsfoss.jpg';
      const dest = trip.destination || '冰島';
      const startDate = trip.startDate || '2026-09-23';
      const endDate = trip.endDate || '2026-10-03';
      const status = trip.status || 'planning';

      card.innerHTML = `
        <div class="trip-cover" style="background-image: url('${cover}')">
          <span class="trip-status status-${status}">${status === 'planning' ? '規劃中' : '進行中'}</span>
        </div>
        <div class="trip-info">
          <h3 class="trip-title">${title}</h3>
          <div class="trip-dest"><i class="fas fa-location-dot"></i> ${dest}</div>
          <div class="trip-dates"><i class="far fa-calendar-alt"></i> ${startDate} ~ ${endDate}</div>
        </div>
      `;
      tripsContainer.appendChild(card);
    }

    function renderDefaultIcelandCard() {
      const card = document.createElement('div');
      card.className = 'trip-card glass';
      card.onclick = () => window.location.href = `trip.html?id=iceland-2026`;
      
      card.innerHTML = `
        <div class="trip-cover" style="background-image: url('images/seljalandsfoss.jpg')">
          <span class="trip-status status-planning">經典範本</span>
        </div>
        <div class="trip-info">
          <h3 class="trip-title">2026 冰島夢幻之旅</h3>
          <div class="trip-dest"><i class="fas fa-location-dot"></i> 冰島環島 11 日</div>
          <div class="trip-dates"><i class="far fa-calendar-alt"></i> 2026-09-23 ~ 2026-10-03</div>
        </div>
      `;
      tripsContainer.appendChild(card);
    }

    // Add Trip Modal Logic
    addTripFab.addEventListener('click', () => addTripModal.style.display = 'flex');
    closeModalBtn.addEventListener('click', () => addTripModal.style.display = 'none');
    
    addTripForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = addTripForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '建立中...';

      try {
        const user = auth.currentUser;
        const name = document.getElementById('trip-name').value;
        const dest = document.getElementById('trip-dest').value;
        const start = document.getElementById('trip-start').value;
        const end = document.getElementById('trip-end').value;
        const cover = document.getElementById('trip-cover').value || 'images/seljalandsfoss.jpg';

        const newTrip = {
          title: name,
          name: name,
          destination: dest,
          startDate: start,
          endDate: end,
          coverImg: cover,
          coverUrl: cover,
          status: 'planning',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          adminUids: [user.uid],
          memberUids: [user.uid],
          admin: user.email,
          members: [user.email]
        };

        const docRef = await db.collection('trips').add(newTrip);
        addTripModal.style.display = 'none';
        addTripForm.reset();
        window.location.href = `trip.html?id=${docRef.id}`;
      } catch (err) {
        console.error("Error adding trip:", err);
        alert("建立失敗：" + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '建立旅程';
      }
    });
  </script>
</body>
</html>

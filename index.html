<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101820" />
  <title>Travel Memoir 旅遊回憶錄 | 專案大廳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Sticky Glass Topbar -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">◒</span>
      <span>TRAVEL MEMOIR · 旅遊回憶錄</span>
    </a>
    <div class="topbar-actions">
      <button id="addTripBtn" class="btn primary"><i class="fa-solid fa-plus"></i> 新增旅遊專案</button>
      <button id="themeBtn" class="icon-btn" aria-label="切換深色模式">☾</button>
    </div>
  </header>

  <main>
    <section class="portal-header">
      <div>
        <div class="eyebrow">MY TRAVEL BOOKS</div>
        <h1 class="portal-title">我的旅遊回憶錄</h1>
        <p class="lead">選擇一個旅遊專案開啟互動旅遊手冊，或建立全新的旅遊規劃。</p>
      </div>
    </section>

    <section id="portalGrid" class="portal-grid"></section>
  </main>

  <!-- Add Trip Modal Overlay -->
  <div id="addTripModal" class="portal-modal-overlay">
    <div class="portal-modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3 style="font-family: Georgia, serif; font-size: 24px;"><i class="fa-solid fa-plane-departure" style="color: var(--accent);"></i> 新增旅遊專案</h3>
        <button id="closeModalBtn" class="icon-btn">&times;</button>
      </div>
      <form id="addTripForm">
        <div class="portal-form-group">
          <label>旅行名稱</label>
          <input type="text" id="tripName" required placeholder="例如：2026 冰島夢幻之旅">
        </div>
        <div class="portal-form-group">
          <label>目的地</label>
          <input type="text" id="tripDest" required placeholder="例如：冰島 環島 11 日">
        </div>
        <div class="portal-form-group">
          <label>出發與結束日期</label>
          <input type="text" id="tripDates" required placeholder="例如：2026/09/23 – 10/03">
        </div>
        <div class="portal-form-group">
          <label>封面圖片網址 (URL) 或相對路徑</label>
          <input type="text" id="tripCover" placeholder="images/seljalandsfoss.jpg">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px;">
          <button type="button" id="cancelModalBtn" class="chip">取消</button>
          <button type="submit" class="btn primary"><i class="fa-solid fa-check"></i> 建立並進入專案</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <span>TRAVEL MEMOIR · interactive travel book portal v1.0</span>
  </footer>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyALQhQzhnkj-UOmRZGVQKMKqkW0DecwE3s",
      authDomain: "my-travel-book-85243.firebaseapp.com",
      projectId: "my-travel-book-85243",
      storageBucket: "my-travel-book-85243.firebasestorage.app",
      messagingSenderId: "936708966292",
      appId: "1:936708966292:web:d3c7c08e14f60548cf3181"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Default Trips
    const defaultTrips = [
      {
        id: 'iceland-2026',
        name: '2026 冰島夢幻之旅',
        dest: '冰島 · 環島 11 日',
        dates: '2026/09/23 – 10/03',
        cover: 'images/seljalandsfoss.jpg',
        badge: '11 天 · 25 景點'
      }
    ];

    // Theme toggle
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeBtn.textContent = isLight ? '☀️' : '☾';
      localStorage.setItem('memoir-portal-theme', isLight ? 'light' : 'dark');
    });
    if (localStorage.getItem('memoir-portal-theme') === 'light') {
      document.body.classList.add('light-mode');
      themeBtn.textContent = '☀️';
    }

    function getCustomTrips() {
      const stored = localStorage.getItem('memoir-custom-trips');
      return stored ? JSON.parse(stored) : [];
    }

    function saveCustomTrips(trips) {
      localStorage.setItem('memoir-custom-trips', JSON.stringify(trips));
    }

    function renderPortal() {
      const grid = document.getElementById('portalGrid');
      grid.innerHTML = '';

      const customTrips = getCustomTrips();
      const allTrips = [...defaultTrips, ...customTrips];

      allTrips.forEach(trip => {
        const card = document.createElement('div');
        card.className = 'portal-card';
        card.onclick = (e) => {
          if (e.target.closest('.portal-card-delete')) return;
          window.location.href = `trip.html?id=${trip.id}`;
        };

        const coverUrl = trip.cover || 'images/seljalandsfoss.jpg';

        card.innerHTML = `
          <div class="portal-card-cover" style="background-image: url('${coverUrl}')">
            <span class="portal-card-badge">${trip.badge || '旅遊手冊'}</span>
            ${trip.id !== 'iceland-2026' ? `<button class="portal-card-delete" title="刪除專案" data-id="${trip.id}"><i class="fa-solid fa-trash"></i></button>` : ''}
          </div>
          <div class="portal-card-body">
            <div class="portal-card-title">${trip.name}</div>
            <div class="portal-card-meta">
              <span>📍 ${trip.dest}</span>
            </div>
            <div class="portal-card-meta" style="margin-top: 4px;">
              <span>📅 ${trip.dates}</span>
            </div>
          </div>
        `;

        if (trip.id !== 'iceland-2026') {
          const delBtn = card.querySelector('.portal-card-delete');
          if (delBtn) {
            delBtn.onclick = (e) => {
              e.stopPropagation();
              if (confirm(`確定要刪除「${trip.name}」專案嗎？`)) {
                const list = getCustomTrips().filter(t => t.id !== trip.id);
                saveCustomTrips(list);
                renderPortal();
              }
            };
          }
        }

        grid.appendChild(card);
      });
    }

    // Modal Logic
    const addTripBtn = document.getElementById('addTripBtn');
    const addTripModal = document.getElementById('addTripModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const addTripForm = document.getElementById('addTripForm');

    addTripBtn.onclick = () => addTripModal.style.display = 'flex';
    closeModalBtn.onclick = cancelModalBtn.onclick = () => addTripModal.style.display = 'none';

    addTripForm.onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById('tripName').value.trim();
      const dest = document.getElementById('tripDest').value.trim();
      const dates = document.getElementById('tripDates').value.trim();
      const cover = document.getElementById('tripCover').value.trim() || 'images/seljalandsfoss.jpg';

      const newId = 'trip-' + Date.now();
      const newTrip = { id: newId, name, dest, dates, cover, badge: '新建立手冊' };

      const list = getCustomTrips();
      list.push(newTrip);
      saveCustomTrips(list);

      addTripModal.style.display = 'none';
      addTripForm.reset();
      
      window.location.href = `trip.html?id=${newId}`;
    };

    renderPortal();
  </script>
</body>
</html>
